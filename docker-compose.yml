version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: hrms_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: hrms

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: hrms_server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/hrms
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - HF_API_TOKEN=${HF_API_TOKEN}
      - CLIENT_URL=${CLIENT_URL}
    depends_on:
      - mongo

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.client
    container_name: hrms_client
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://server:5000
    depends_on:
      - server

volumes:
  mongo_data:
